<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 背景 -->
  <rect width="512" height="512" fill="#1a1a2e"/>
  
  <!-- 外圈 -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="#e94560" stroke-width="20"/>
  
  <!-- 内圈 -->
  <circle cx="256" cy="256" r="200" fill="#16213e" stroke="#e94560" stroke-width="5"/>
  
  <!-- 锤子与镰刀符号 -->
  <g transform="translate(256, 256) scale(0.8)">
    <!-- 镰刀 -->
    <path d="M -80 -60 
             Q -80 -120, -20 -120 
             Q 40 -120, 40 -60 
             Q 40 0, -20 0 
             L -20 20" 
          fill="none" 
          stroke="#e94560" 
          stroke-width="25" 
          stroke-linecap="round"/>
    
    <!-- 锤子 -->
    <rect x="-60" y="20" width="40" height="100" fill="#e94560" rx="5"/>
    <rect x="-90" y="20" width="100" height="40" fill="#e94560" rx="5"/>
  </g>
  
  <!-- 星星 -->
  <polygon points="256,80 268,115 305,115 275,138 286,173 256,152 226,173 237,138 207,115 244,115" 
           fill="#ffd700"/>
</svg>
